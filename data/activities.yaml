items:
  - date: 2026-03-10
    kind: talk
    where: "DPG Spring Meeting 2026"
    image: "/img/uploads/dpg-2026-grain-boundaries.jpg"
    en:
      title: "Multiscale Simulation of Charge Transport Across Grain Boundaries in Organic Polycrystalline Thin-Film Semiconductors"
      summary: "With Prof. Harald Oberhofer. BayBatt, University of Bayreuth."
      # Verbatim as supplied, with the line-end hyphenation of the copied PDF
      # closed up (corre-lates, simu-lations, en-ergetic, fun-damental,
      # pro-vide). Nothing else was changed.
      abstract: >-
        Grain boundaries (GBs) are known to critically limit charge carrier
        mobility in organic polycrystalline semiconductors as already used in
        e.g. organic field effect transistors. In our contribution, we address
        Technologies with a multiscale computational framework that correlates
        a GB's morphology with its influence on the charge transport
        properties. Our approach is, at its core, based on phase-field
        simulations of grain growth to generate realistic GB networks.
        Electronic structure calculations then reveal deep trap states and
        significant energetic disorder at the GB, leading to substantial
        injection barriers. Charge transfer rates across GBs are then
        calculated from a hopping model which are finally fed into kinetic
        Monte Carlo simulations to demonstrate the device level influence of
        GBs. They elucidate the fundamental role of grain boundaries in
        limiting charge transport and provide critical guidelines for the
        development of future high-performance organic electronics devices.
