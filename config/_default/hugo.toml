# -- Site-wide configuration --
# User site served at the account root. (CI overrides this with the Pages URL at build time.)
# For a custom domain later, change this to https://your-domain.com/
baseURL = "https://nangmo-tadj.github.io/"

theme = "congo"

defaultContentLanguage = "en"

enableRobotsTXT = true
summaryLength = 30

# Pretty, human-readable taxonomy names
[taxonomies]
  tag = "tags"
  category = "categories"

[outputs]
  home = ["HTML", "RSS", "JSON"]  # JSON output powers the search index

[imaging]
  anchor = "Center"
