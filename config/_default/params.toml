# -- Theme Options --
# Full reference: https://jpanther.github.io/congo/docs/configuration/

colorScheme = "tadjeugue"      # custom azure + amber palette (assets/css/schemes/tadjeugue.css)
defaultAppearance = "light"    # light or dark
autoSwitchAppearance = true    # follow the visitor's OS preference

defaultThemeColor = "#3e93be"   # the one accent colour, muted azure

enableSearch = true            # header search (needs JSON output, configured in hugo.toml)
enableCodeCopy = true          # copy button on code blocks
enableImageLazyLoading = true
enableImageWebp = true

fingerprintAlgorithm = "sha256"

[header]
  layout = "hybrid"            # collapses to a hamburger on small screens
  showTitle = true

[footer]
  showCopyright = true
  showThemeAttribution = false
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "custom"           # project layout: profile + activity feed + recent posts
  showRecent = true           # show a "recent posts" feed under the activity
  recentLimit = 4
  showRecentItems = 4

[article]
  showDate = true
  showDateUpdated = false
  showAuthor = true
  showBreadcrumbs = true
  showDraftLabel = true
  showEdit = false
  showHeadingAnchors = true
  showPagination = true
  showReadingTime = true
  showTableOfContents = true
  showTaxonomies = true
  showWordCount = true
  showComments = false
  sharingLinks = ["linkedin", "x-twitter", "email", "reddit"]

[list]
  showBreadcrumbs = true
  showSummary = true
  showTableOfContents = false
  showTaxonomies = false
  groupByYear = false
  paginationWidth = 1

[sitemap]
  excludedKinds = ["taxonomy", "term"]

[taxonomy]
  showTermCount = true
